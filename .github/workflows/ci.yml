name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Rebuild report (full data)
        run: python run_analysis.py --outdir .ci/reports --site-dir .ci/site

      - name: Smoke test sample mode
        run: python run_analysis.py --sample --outdir .ci/sample-reports --site-dir .ci/sample-site
